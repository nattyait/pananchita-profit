<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}กำไรจริง{% endblock %} · Pananchita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <span class="brand">ปนันชิตา · กำไรจริง</span>
  <nav>
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>กำไร</a>
    <a href="/upload" {% if request.url.path == '/upload' %}aria-current="page"{% endif %}>อัพโหลดรายงาน</a>
    <a href="/uploads" {% if request.url.path == '/uploads' %}aria-current="page"{% endif %}>ประวัติอัพโหลด</a>
    <a href="/sku-costs" {% if request.url.path == '/sku-costs' %}aria-current="page"{% endif %}>ต้นทุนสินค้า</a>
    <a href="/expenses" {% if request.url.path == '/expenses' %}aria-current="page"{% endif %}>ค่าใช้จ่าย</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
